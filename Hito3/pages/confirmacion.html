<!DOCTYPE html>

                <p><strong>Horario:</strong> <span id="detalle-horario"></span></p>
                <p><strong>Equipamiento extra:</strong> <span id="detalle-extras"></span></p>
                <p><strong>Total:</strong> <span id="detalle-total"></span></p>
            </article>
            <p><a class="btn-neon" href="mis-reservas.html">Ver mis reservas</a></p>
        </section>
    </main>
